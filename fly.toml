# =============================================================================
# fly.toml — Fly.io deploy config for the Orion relay (deployment Option A)
# -----------------------------------------------------------------------------
# Builds the repo's Dockerfile and runs the relay on Fly, which terminates TLS in
# front of it. CHANGE `app` to your own globally-unique name before deploying.
#
# Secrets are NOT in this file — set them with `fly secrets set` (see
# docs/deployment.md). The relay needs:
#   ORION_RELAY_TOKEN        — ingest Bearer token (must match your local [relay] config)
#   ORION_RELAY_VIEW_TOKEN   — bootstrap-admin login key + the non-loopback bind guard
#   ORION_RELAY_SESSION_KEY  — signs the dashboard login session cookie
#   ORION_RELAY_USER_PEPPER  — hashes stored login-key verifiers
#   ORION_RELAY_ADMIN_TOKEN  — provisioning API (`relay-user`), independent of the ingest token
# =============================================================================

app = "project-orion"
primary_region = "sjc"   # pick one near you / your supervisors: `fly platform regions`

[build]
  dockerfile = "Dockerfile"

# Non-secret config. ORION_RELAY_PUBLIC_ORIGIN is the canonical public URL the dashboard is
# reached at; the relay checks the comment form's Origin/Referer against it (CSRF), instead of
# trusting the proxy-rewritten Host header. CHANGE this to match your own `app` name above.
[env]
  ORION_RELAY_PUBLIC_ORIGIN = "https://project-orion.fly.dev"

# Fly terminates HTTPS and forwards to the container's port 8787. The relay binds
# 0.0.0.0:8787 (the Dockerfile entrypoint), so the fail-closed guard REQUIRES the
# view secret on that non-loopback bind — a misconfigured deploy refuses to start.
[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0   # scale to zero when idle; set to 1 to stay warm (no cold start)

# Health check against the relay's unauthenticated GET /healthz (AU1-R F2). Before this,
# Fly had no way to tell a serving relay from a wedged one — a hung process kept taking
# traffic. /healthz touches neither auth nor sqlite, so it answers even when the store is
# the thing that is broken (liveness, not readiness — that distinction is deliberate).
#
# UNVERIFIED INTERACTION, read this before trusting it: the app scales to zero
# (min_machines_running = 0 above). Fly's docs — the configuration reference, the
# autostop/autostart page, and the health-checks reference — do not state whether checks
# run against a STOPPED machine, whether they can wake one, or whether they count as the
# traffic that defeats autostop. Machine checks are believed to be run by flyd on a
# RUNNING machine and not to be proxy requests, which would leave scale-to-zero intact,
# but that is inference, not documented fact. So: after the first deploy that includes
# this block, confirm with `fly status` that the machine still returns to `stopped` after
# the idle window. If it stays awake, delete this block — the cost of an always-on machine
# is not worth the check.
[[http_service.checks]]
  grace_period = "10s"   # the Python import + sqlite migration run before the first 200
  interval = "30s"
  timeout = "5s"
  method = "GET"
  path = "/healthz"

# Persist the sqlite store across restarts/redeploys (it lives at /data in the image).
# Create the volume first, in the SAME region:
#   fly volumes create orion_data --size 1 --region iad
[mounts]
  source = "orion_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"   # comfortable for the Python import; try 256mb to trim cost

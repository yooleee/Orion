# =============================================================================
# pyproject.toml
# -----------------------------------------------------------------------------
# Responsible for: Packaging metadata and the single `orion` console command.
# Role in project: Defines how Orion installs (`pip install -e .`) and the
#                  runtime dependencies. Deliberately minimal — two functional
#                  third-party packages (anthropic, python-dotenv) plus tzdata, a
#                  data-only tz database for the relay's Pacific timestamps; config
#                  (tomllib), state (sqlite3), git (subprocess), and HTTP (urllib)
#                  are all stdlib.
# Assumptions: Python 3.11+ (for stdlib `tomllib`). src/ layout.
# =============================================================================

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orion"
# Pre-release placeholder: Orion is unversioned during development — progress is
# tracked by phase, not SemVer (see CHANGELOG.md). 0.0.0 = "no release cut yet";
# bump to a real version at the first published release.
version = "0.0.0"
description = "Local-first progress tracker: turn git activity into supervisor-ready updates."
requires-python = ">=3.11"
# Declarative metadata (for PyPI filtering / display) that backs the README's
# support matrix. "OS Independent" reflects the stdlib-only, pathlib-based core;
# the Python versions are the range allowed by requires-python above.
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    # Official Anthropic client for the Messages API — the summarizer (raw lane only).
    "anthropic>=0.40",
    # Loads secrets from a gitignored .env (webhook URLs, API key) into the environment.
    "python-dotenv>=1.0",
    # IANA time-zone database for stdlib `zoneinfo`. Data-only (no code, no transitive
    # deps), maintained by the CPython core team. Needed because the relay dashboard
    # renders timestamps in America/Los_Angeles (DST-correct PDT/PST), and the
    # platforms that lack a SYSTEM tz database — the python:*-slim Docker base the
    # relay deploys on, and native Windows — would otherwise raise at render time.
    # zoneinfo falls back to this package automatically; Linux/macOS use their own.
    "tzdata",
]

[project.optional-dependencies]
# Test-only dependency. Kept out of the runtime install so a user who just wants
# to run Orion still gets the two-dependency "clone and run in 10 minutes" path.
dev = ["pytest>=8.0"]
# Native Slack bot (C2-bots, `orion bot`). slack-bolt holds the Socket Mode
# connection (its outbound WebSocket, heartbeat, and reconnect); it pulls in
# slack_sdk. Kept OPTIONAL and lazily imported (only inside orion.bot.slack_bot)
# so the core install stays at three deps for everyone NOT running the bot. This
# optional-extra shape is the smallest-slice choice and is expected to graduate to
# a first-class integration as the bot becomes load-bearing (the seams keep that
# additive — see plans/build-the-native-bots-slice-squishy-key.md).
slack-bot = ["slack-bolt>=1.18"]
# Relay-side password hashing (auth revamp, Unit 3). Argon2id is the current
# first-choice password hash — memory-hard and side-channel-resistant — and is
# genuinely stronger here than anything the stdlib offers, which is why a real
# dependency was accepted. It is RELAY-ONLY by construction: hashing happens
# exclusively on the relay, so this rides the relay deployment (the Dockerfile
# installs `.[relay]`) and the producer core install stays at three runtime deps.
# Pinned to a major version so an upgrade that changed defaults cannot arrive
# unnoticed — though relay/passwords.py also passes every parameter explicitly,
# so stored hashes stay verifiable regardless.
relay = ["argon2-cffi>=23.1,<26"]

[project.scripts]
# Installs an `orion` command on PATH that calls orion.cli:main.
orion = "orion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Add the repo root to sys.path for the test session so tests can import the
# top-level `relay/` package. relay/ is the separately-deployable hosted half
# (C1) and is intentionally NOT part of the src/ wheel (packages.find is
# src-only above), so it isn't installed and wouldn't otherwise be importable.
# `pythonpath` is pytest's purpose-built option for exactly this case. The
# `orion` package keeps importing via its editable install from src/.
pythonpath = ["."]
